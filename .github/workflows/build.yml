name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Évite l'accumulation de jobs macOS (runners rares) : les runs PR
# obsolètes sont annulés au lieu de rester en file d'attente.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        include:
          - os: ubuntu-latest
            build-command: npm run release:lin
            artifact-name: linux
          - os: windows-latest
            build-command: npm run release:win
            artifact-name: windows
          - os: macos-15
            build-command: npm run release:mac
            artifact-name: macos
            skip-codesign: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: ${{ matrix.build-command }}
        shell: bash
        env:
          SKIP_NOTARIZE: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.skip-codesign && 'false' || 'true' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-name }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-*/*
